[package]
name = "audit-trail"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Cryptography ---
ring = "0.17"
sha2 = "0.10"
rand = "0.9"          # Diperbarui dari 0.8 mengikuti proxy
hex = "0.4.3"         # Diperbarui dari 0.4 mengikuti proxy

# --- Async & Runtime ---
tokio = { version = "=1.44.2", features = ["full"] }
tokio-util = { version = "0.7.11", features = ["codec"] }

# --- Web, HTTP & Database ---
axum = "0.8.4"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "macros"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Error handling ---
thiserror = "2.0"     # Diperbarui dari 1 mengikuti proxy
anyhow = "1.0"        # Diperbarui dari 1 mengikuti proxy

# --- Time & Utilities ---
chrono = { version = "0.4.39", features = ["serde"] }       # Diperbarui dari 0.4.39 mengikuti proxy
uuid = { version = "1", features = ["serde", "v4", "v7"] } # Versi disamakan ke 1, fitur v7 & serde dipertahankan
dotenvy = "0.15.7"

# --- IOTA ---
iota-sdk = { git = "https://github.com/iotaledger/iota", rev = "3d7c588ac81a2fdee000bdcde7d390bf62985e05", package = "iota-sdk" }
iota-keys = { git = "https://github.com/iotaledger/iota", rev = "3d7c588ac81a2fdee000bdcde7d390bf62985e05", package = "iota-keys" }
iota-config = { git = "https://github.com/iotaledger/iota", rev = "3d7c588ac81a2fdee000bdcde7d390bf62985e05", package = "iota-config" }
iota-types = { git = "https://github.com/iotaledger/iota", rev = "3d7c588ac81a2fdee000bdcde7d390bf62985e05", package = "iota-types" }
iota-json-rpc-types = { git = "https://github.com/iotaledger/iota", rev = "3d7c588ac81a2fdee000bdcde7d390bf62985e05", package = "iota-json-rpc-types" }
shared_crypto = { git = "https://github.com/iotaledger/iota", rev = "3d7c588ac81a2fdee000bdcde7d390bf62985e05", package = "shared-crypto" }

[dev-dependencies]
tempfile = "3"