[package]
name = "audit-trail"
version = "0.1.0"
edition = "2021"

[lib]
name = "lava_ats"
path = "src/lib.rs"

[[bin]]
name = "ats"
path = "src/main.rs"

[dependencies]
# --- Cryptography ---
ring = "0.17"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

# --- mTLS (Mutual TLS) ---
rustls = "0.21"
rustls-pemfile = "1"
tokio-rustls = "0.24"

# --- Async & Runtime ---
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }

# --- Web, HTTP & Database ---
axum = "0.8.4"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "macros"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Error handling ---
thiserror = "1"
anyhow = "1"

# --- Time & Utilities ---
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["serde", "v4", "v7"] }
dotenvy = "0.15.7"

[dev-dependencies]
tempfile = "3"