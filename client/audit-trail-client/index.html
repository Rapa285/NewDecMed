<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Trail Log Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>Audit Trail — Log Metadata</h1>
        <div class="topbar-actions">
          <span id="status-pill" class="pill pill-idle">idle</span>
          <button id="settings-btn" class="btn btn-ghost" title="Pengaturan">⚙︎</button>
          <button id="refresh-btn" class="btn btn-primary">Refresh</button>
        </div>
      </header>

      <section id="settings-panel" class="settings-panel hidden">
        <label for="base-url-input">Audit-trail base URL</label>
        <div class="settings-row">
          <input
            id="base-url-input"
            type="text"
            placeholder="http://localhost:3000"
          />
          <button id="save-settings-btn" class="btn btn-primary">Simpan</button>
        </div>
        <p class="hint">
          Client akan memanggil <code>GET {base URL}/api/logs</code>.
        </p>
      </section>

      <section id="error-banner" class="error-banner hidden"></section>

      <main>
        <table class="log-table">
          <thead>
            <tr>
              <th>Seq</th>
              <th>Object ID</th>
              <th>Rotation Timestamp</th>
              <th>Record Count</th>
              <th>IPFS CID</th>
              <th>File Hash</th>
              <th>Prev TX Digest</th>
            </tr>
          </thead>
          <tbody id="log-table-body">
            <tr>
              <td colspan="7" class="empty-state">Belum ada data. Klik "Refresh".</td>
            </tr>
          </tbody>
        </table>

        <div class="load-more-row">
          <button id="load-more-btn" class="btn btn-ghost hidden">Muat lebih banyak</button>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
